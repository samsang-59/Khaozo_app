services:
  postgres:
    build: ./docker/postgres
    image: khaozo-postgres:17-postgis-pgvector
    environment:
      POSTGRES_USER: khaozo
      POSTGRES_PASSWORD: khaozo
      POSTGRES_DB: food_app
    ports:
      # Host 5433 → container 5432 (a native Windows PostgreSQL may already use 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khaozo -d food_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ needs noeviction (queued jobs must never be evicted)
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
