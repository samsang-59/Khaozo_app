name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-app-backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://khaozo:khaozo@localhost:5433/food_app
      TEST_DATABASE_URL: postgres://khaozo:khaozo@localhost:5433/food_app_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5

      # Same docker-compose as local (custom PostGIS + pgvector image, Redis)
      - name: Start Postgres + Redis
        run: docker compose up -d --build --wait

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: food-app-backend/package-lock.json

      - run: npm ci
      - run: npm test
