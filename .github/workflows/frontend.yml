name: Frontend

on:
  push:
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khaozo-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: khaozo-frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
